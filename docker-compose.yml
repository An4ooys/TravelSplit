services:
  postgres:
    image: postgres:16-alpine
    container_name: travelsplit-postgres
    environment:
      POSTGRES_DB: travelsplit
      POSTGRES_USER: travelsplit
      POSTGRES_PASSWORD: travelsplit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelsplit -d travelsplit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
