spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/travelsplit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:travelsplit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:travelsplit}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

notifications.scheduler.fixed-rate-ms=30000
notifications.webhook.bot-url=${BOT_WEBHOOK_URL:http://127.0.0.1:8081/webhook/notifications}
notifications.webhook.secret=${WEBHOOK_SECRET:}
