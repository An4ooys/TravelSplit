spring.application.name=travelsplit-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:travelsplit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

notifications.scheduler.fixed-rate-ms=30000
notifications.webhook.bot-url=${BOT_WEBHOOK_URL:http://127.0.0.1:8081/webhook/notifications}
notifications.webhook.secret=${WEBHOOK_SECRET:}
